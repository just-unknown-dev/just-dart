name: just_dart
description: "Allocation-free math for Flutter games: mutable Vector2, Vector3 and Quaternion, Matrix4 helpers, Aabb3, Ray3, Plane, Frustum culling and a Quadtree."
version: 0.2.0
homepage: https://engine.justunknown.com/
repository: https://github.com/just-unknown-dev/just-dart
issue_tracker: https://github.com/just-unknown-dev/just-dart/issues
topics:
  - math
  - vector
  - geometry
  - gamedev
  - game

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  # For Offset and Rect (dart:ui), so every platform Flutter runs on works,
  # the web under dart2js and dart2wasm included.
  flutter:
    sdk: flutter
  # Only for Matrix4: the 64-bit class Flutter itself exports. Every other
  # math type here is this package's own.
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
